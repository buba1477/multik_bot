# ============================================================================
#  Центральная конфигурация инструментов разработки проекта multik_bot.
#
#  Роли инструментов:
#    * Ruff  -> ТОЛЬКО линтер и проверка импортов (lint / import checker).
#    * Black -> форматтер (уже используется, НЕ заменяем).
#    * isort -> сортировка импортов (уже используется).
#
#  ВАЖНО: сам Ruff НЕ форматирует проект. Запуск `ruff format .` требует
#  отдельного явного согласия владельца проекта.
# ============================================================================

[tool.ruff]
# Длина строки согласована со стандартом проекта. E501 отключён отдельно,
# т.к. в legacy-коде встречаются длинные строки (~300 симв).
line-length = 100
target-version = "py313"            # venv проекта создан под Python 3.13

# Каталоги и файлы, которые не должен анализировать Ruff.
extend-exclude = [
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "qdrant_storage",
    "hf_cache",
    "images_cache",
    "llama.cpp",
    "unsloth_compiled_cache",
    "bm25_cache.pkl",
    "*.tar.gz",
    "*.bak",
    "*.bak2",
    "*.bak3",
    "static",
    "templates",
]

[tool.ruff.lint]
# F  -> неиспользуемые импорты/имена (F401, F821), базовые ошибки.
# E4 -> импорты не в начале модуля (E402) и т.п.
# E7, E9 -> потенциальные ошибки и проблемы синтаксиса.
# W  -> стилевые предупреждения.
# B  -> bugbear: вероятные ошибки в коде.
#
# I (сортировку импортов) сознательно НЕ включаем: сортировкой занимается
# isort (уже настроен с профилем black) — чтобы не было конфликта двух систем.
select = ["E4", "E7", "E9", "F", "W", "B"]

# E501 — длинные строки: игнорируем, чтобы не создавать шум в legacy-коде.
ignore = ["E501"]

# ----------------------------------------------------------------------------
#  pytest (конфигурация тестового раннера).
#  Структура тестов предлагается: tests/conftest.py, tests/unit/, tests/integration/.
#  Фиктивные тесты нарочно не создаём.
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
# Тесты собираем только из каталога tests/ — это исключает сканирование корня
# проекта (где есть root-овые симлинки вроде v4.gguf, нечитаемые текущим юзером).
testpaths = ["tests"]
norecursedirs = [
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    "qdrant_storage",
    "hf_cache",
    "images_cache",
    "llama.cpp",
    "*.cache",
]
asyncio_mode = "auto"