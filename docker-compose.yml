version: '3.8'

services:
  # 0. REDIS (Возвращаем локальный кэш, доступный отовсюду) 🧠
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6381:6379" # Открыт настежь, как раньше

  # 1. OLLAMA (Твоя видеокарта снова открыта для туннеля)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container
    restart: always
    ports:
      - "11434:11434" # Твой туннель из Амстердама снова увидит Олламу напрямую!
    volumes:
      - /home/amlin04/.ollama:/root/.ollama
    environment:
      - OLLAMA_MAX_QUEUE=128
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=1 
      - OLLAMA_KV_CACHE_TYPE=q8_0     
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 2. QDRANT (База данных кадров снова доступна для бота напрямую) 🚀
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333" # HTTP API открыт
      - "6344:6334" # gRPC открыт
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # 3. FASTAPI (Старый добрый шлюз без сетевых ограничений)
  api:
    build: .
    image: multik-core:latest
    container_name: multik_api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    ports:
      - "8000:8000" # Открыт для Tailscale настежь
    command: uvicorn main_api:app --host 0.0.0.0 --port 8000 
    env_file: [.env]
    volumes:
      - ./:/app
      - ./hf_cache:/root/.cache/huggingface
      # Оставляем этот фикс волюма, чтобы питон не ругался на отсутствие FRIDA
      - ./hf_cache:/app/hf_cache 
      - ./static:/app/static 
      - ./images_cache:/app/images_cache
    environment:
      - HF_HUB_OFFLINE=1      
      - TRANSFORMERS_OFFLINE=1
      - OLLAMA_HOST=http://ollama_container:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
