<h1>РАСПОРЯЖЕНИЕ</h1>
<p>Правительства Российской Федерации от 22.05.2025 № 987-р</p>
<p>1. Утвердить план мероприятий.</p>
<p>2. Минцифры обеспечить реализацию в срок до 01.12.2025.</p>
<p>3. Настоящее распоряжение вступает в силу со дня подписания.</p>
<p>Председатель Правительства М. Мишустин</p>
